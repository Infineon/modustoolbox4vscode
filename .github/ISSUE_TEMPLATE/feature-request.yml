name: Feature request
description: Suggest an improvement to the extension.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing requests before submitting. This request will be public;
        do not include confidential roadmap, customer, or project information.
        For suspected vulnerabilities, use the repository's security policy instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to achieve, and what currently prevents it?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Proposed improvement
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Describe any approaches you have already considered or tried.
  - type: checkboxes
    id: public-information
    attributes:
      label: Public information check
      options:
        - label: I have reviewed this request and its attachments and removed sensitive information.
          required: true